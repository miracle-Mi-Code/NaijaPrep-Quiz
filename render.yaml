services:
  # Single Web Service – Express serves both the REST API and the built React app
  - type: web
    name: naijaprep-backend
    runtime: node
    rootDir: backend
    # 1. Install backend deps, then build the React frontend (output → backend/public)
    buildCommand: npm install && npm run build && echo "Build completed successfully"
    # 2. Start the Express server (serves API + React static files)
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false          # REQUIRED: Paste your PostgreSQL connection string from Render/Neon in the dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random secret
      - key: FRONTEND_URL
        sync: false          # Optional – your custom domain if you add one later
